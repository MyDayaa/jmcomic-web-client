name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      verify_now:
        description: Run verification and deployment even if upstream is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MyDayaa/jmcomic-web-client' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test merge preservation and conflict handling
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_sync_upstream.py' -v
      - name: Configure merge author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream without resetting fork changes
        id: sync
        run: bash scripts/sync-upstream.sh
      - name: Verify and deploy the synchronized main branch
        if: steps.sync.outputs.changed == 'true' || inputs.verify_now == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify-page.yml --ref main
